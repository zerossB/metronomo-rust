name: Release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_BUILD_JOBS: '2'

jobs:
  build:
    name: Test and build Linux amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    outputs:
      version: ${{ steps.version.outputs.version }}
      package_file: ${{ steps.version.outputs.package_file }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Check out version tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Require a commit from main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Validate tag, package version, and release notes
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/release/version.py --tag "$RELEASE_TAG" --github-output "$GITHUB_OUTPUT"

      - name: Set up Linux build
        uses: ./.github/actions/setup
        with:
          cache-prefix: release

      - name: Run development checks
        run: ./scripts/check.sh

      - name: Validate optimized renderer timing
        run: ./scripts/validation/audio.sh renderer

      - name: Build Debian package
        run: ./scripts/release/package-deb.sh

      - name: Check clean installation on supported Ubuntu versions
        env:
          PACKAGE_FILE: ${{ steps.version.outputs.package_file }}
        run: |
          for ubuntu_version in 24.04 26.04; do
            evidence_directory="$PWD/dist/evidence/install-ubuntu-$ubuntu_version"
            mkdir -p "$evidence_directory"
            docker run --rm \
              -v "$PWD/dist/build:/packages:ro" \
              -v "$PWD/scripts/validation:/checks:ro" \
              -v "$evidence_directory:/evidence:rw" \
              "ubuntu:$ubuntu_version" \
              bash /checks/install-deb.sh "/packages/$PACKAGE_FILE" /evidence
          done
          python3 scripts/release/prepare-release.py --package "dist/build/$PACKAGE_FILE"

      - name: Save release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-release
          path: ${{ steps.version.outputs.release_dir }}/
          if-no-files-found: error
          retention-days: 14

      - name: Save validation evidence on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-failure-evidence
          path: dist/evidence/
          if-no-files-found: ignore
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download verified release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-release
          path: delivery

      - name: Verify delivery checksums
        working-directory: delivery
        run: sha256sum --check SHA256SUMS

      - name: Create downloadable release assets
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          PACKAGE_FILE: ${{ needs.build.outputs.package_file }}
        run: |
          mkdir assets
          cp "delivery/$PACKAGE_FILE" assets/
          tar -czf "assets/metronomo-$RELEASE_VERSION-linux-amd64.tar.gz" -C delivery .
          cd assets
          sha256sum ./*.deb ./*.tar.gz > SHA256SUMS

      - name: Publish version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          options=()
          if [[ "$PRERELEASE" == true ]]; then
            options+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" --draft \
            --verify-tag --title "Metronomo $RELEASE_VERSION" \
            --notes-file delivery/RELEASE-NOTES.md "${options[@]}"
          gh release upload "$RELEASE_TAG" assets/*
          gh release edit "$RELEASE_TAG" --draft=false
