[package]
name = "metronomo"
version = "0.1.2"
edition = "2024"
description = "A desktop metronome built with Rust and GPUI"
license = "MIT"
authors = ["Guilherme Haynes Howe"]
publish = false

[dependencies]
cpal = "0.18.2"
dirs = "7"
gpui-kit = "0.10.0"
rtrb = "0.4.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"

[dev-dependencies]
gpui-kit = { version = "0.10.0", features = ["test-support"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
expect_used = "deny"
