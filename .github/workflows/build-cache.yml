name: Warm release build cache

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'scripts/release/**'
      - 'scripts/validation/audio.sh'
      - 'packaging/linux/**'
      - '.github/actions/setup/**'
      - '.github/workflows/build-cache.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: warm-release-cache-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_BUILD_JOBS: '4'

jobs:
  warm:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore release compilation cache
        uses: ./.github/actions/setup
        with:
          cache-profile: release
      - name: Validate renderer and compile release package
        run: ./scripts/release/package-deb.sh
      - name: Save candidate Debian package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: metronomo-linux-amd64-candidate
          path: dist/build/*.deb
          if-no-files-found: error
          retention-days: 7
