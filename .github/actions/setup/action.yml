name: Set up Linux build
description: Install native dependencies and the pinned Rust toolchain, then cache and fetch Cargo dependencies.

inputs:
  cache-profile:
    description: Compiled profiles to restore (debug, release, or all)
    default: debug

runs:
  using: composite
  steps:
    - name: Install Linux dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential ca-certificates debhelper dpkg-dev pkg-config python3 git \
          desktop-file-utils libasound2-dev libfontconfig1-dev libfreetype-dev \
          libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev libwayland-dev

    - name: Install pinned Rust toolchain
      shell: bash
      run: |
        rust_toolchain="$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')"
        rustup toolchain install "$rust_toolchain" --profile minimal --component rustfmt --component clippy

    - name: Cache downloaded dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: cargo-downloads-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
        restore-keys: cargo-downloads-v2-${{ runner.os }}-${{ runner.arch }}-

    - name: Cache debug compilation
      if: inputs.cache-profile != 'release'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: target/debug
        key: cargo-build-v3-${{ runner.os }}-${{ runner.arch }}-debug-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.toml', 'Cargo.lock') }}-${{ hashFiles('src/**') }}
        restore-keys: |
          cargo-build-v3-${{ runner.os }}-${{ runner.arch }}-debug-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.toml', 'Cargo.lock') }}-
          cargo-build-v3-${{ runner.os }}-${{ runner.arch }}-debug-${{ hashFiles('rust-toolchain.toml') }}-

    - name: Cache optimized compilation
      if: inputs.cache-profile != 'debug'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: target/release
        key: cargo-build-v3-${{ runner.os }}-${{ runner.arch }}-release-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.toml', 'Cargo.lock') }}-${{ hashFiles('src/**') }}
        restore-keys: |
          cargo-build-v3-${{ runner.os }}-${{ runner.arch }}-release-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.toml', 'Cargo.lock') }}-
          cargo-build-v3-${{ runner.os }}-${{ runner.arch }}-release-${{ hashFiles('rust-toolchain.toml') }}-

    - name: Fetch locked dependencies
      shell: bash
      run: cargo fetch --locked
